plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.16' apply false
    id 'net.fabricmc.fabric-loom-companion' version '1.17.16' apply false
}

allprojects {
    version = mod_version
    group = mod_group_id
}

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(25)
            withSourcesJar()
        }
    }
}

def fabricJarFile = project(':fabric').layout.buildDirectory.file(
        "libs/${mod_id}-fabric-${mod_version}.jar"
)
def neoForgeJarFile = project(':neoforge').layout.buildDirectory.file(
        "libs/${mod_id}-neoforge-${mod_version}.jar"
)

def universalJar = tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds one mod jar that can be loaded by Fabric or NeoForge.'
    dependsOn ':fabric:jar', ':neoforge:jar'

    archiveBaseName = mod_id
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes(
                'Fabric-Mapping-Namespace': 'official',
                'Fabric-Minecraft-Version': minecraft_version,
                'Fabric-Loader-Version': fabric_loader_version
        )
    }

    from(zipTree(fabricJarFile)) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
    from(zipTree(neoForgeJarFile)) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
}

tasks.named('assemble') {
    dependsOn universalJar
}

tasks.named('check') {
    dependsOn ':common:check', ':neoforge:check', ':fabric:check'
}

tasks.named('clean') {
    dependsOn ':common:clean', ':neoforge:clean', ':fabric:clean'
}
